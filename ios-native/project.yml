name: SKonnection
options:
  bundleIdPrefix: com.hyubs
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "20"
    DEVELOPMENT_TEAM: S9F62N3WJA
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

# supabase-swift: Slack(OIDC) 로그인에 auth 모듈이 필요해 도입(웹과 같은 라이브러리 계열).
# signInWithOAuth 가 ASWebAuthenticationSession·PKCE·세션을 자동 처리한다.
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"

targets:
  SKonnection:
    type: application
    platform: iOS
    sources:
      - path: Sources/SKonnection
    dependencies:
      - package: Supabase
        product: Supabase
    info:
      path: Sources/SKonnection/Info.plist
      properties:
        CFBundleDisplayName: SKonnection
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBG
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Slack(OIDC) 로그인 콜백. Supabase Auth 의 Redirect URLs 허용목록에도
        # 같은 값(skonnection://login-callback)이 등록돼야 최종 콜백이 앱으로 돌아온다.
        CFBundleURLTypes:
          - CFBundleURLName: com.hyubs.skonnection.auth
            CFBundleURLSchemes:
              - skonnection
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hyubs.skonnection
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
